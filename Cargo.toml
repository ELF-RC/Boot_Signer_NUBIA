[package]
name = "boot_signer"
version = "1.0.0"
edition = "2021"
description = "Sign/verify Android boot images (AOSP BootSignature) - single-binary replacement for boot_signer.jar"

[[bin]]
name = "boot_signer"
path = "src/main.rs"

[dependencies]
sha2 = { version = "0.10", features = ["oid"] }
sha1 = { version = "0.10", features = ["oid"] }
rsa = "0.9"
p256 = { version = "0.13", features = ["ecdsa"] }
p384 = { version = "0.13", features = ["ecdsa"] }
p521 = { version = "0.13", features = ["ecdsa"] }
x509-parser = "0.16"

[profile.release]
opt-level = 2
strip = true
